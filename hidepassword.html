<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password Hide&Show</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @media (max-width:600px) {
            h3 {
                color: #b9a6a8f0 !important;
                position: relative !important;
                bottom: 63px !important;
                font-size: 7px !important;
            }
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-image: url("https://images.unsplash.com/photo-1485470733090-0aae1788d5af?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fHdhbGxwYXBlcnxlbnwwfHwwfHx8MA%3D%3D");
            background-repeat: no-repeat;
            background-size: cover;
        }

        .container {
            position: relative;
        }

        input {
            padding: 12px 40px 12px 12px;
            font-size: 16px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        label {
            font-size: 23px;
        }

        .eye-icon {
            position: absolute;
            right: 10px;
            top: 68%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #490808;
        }

        .eye-icon:hover {
            color: rgb(115, 108, 108);
        }

        h3 {
            color: #ccc;
            position: relative;
            bottom: 80px;
            font-family: serif;
        }
    </style>
</head>

<body>

    <h3>Hide & Show password project</h3>

    <div class="container">
        <label>Your password</label><br>
        <input type="password" id="password" placeholder="Enter password">
        <i class="fa-solid fa-eye eye-icon" id="eyeicon" onclick="hidepassword()"></i>
    </div>
    <script>
        function hidepassword() {
            let passfield = document.getElementById("password");
            let icon = document.getElementById("eyeicon");

            if (passfield.type === "password") {
                passfield.type = "text";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            } else {
                passfield.type = "password";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            }
        }
    </script>
</body>

</html>
